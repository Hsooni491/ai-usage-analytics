name: ai_usage
version: "1.0.0"
config-version: 2
profile: ai_usage

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Weeks per month, used to turn weekly hours saved into monthly
  weeks_per_month: 4.33

models:
  ai_usage:
    # Helper views live in `staging`; only consumer-facing tables go to `gold`.
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

data_tests:
  ai_usage:
    +severity: error
