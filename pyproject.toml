[project]
name = "ai-usage-analytics"
version = "1.0.0"
description = "Lakehouse pipeline (PySpark + dbt + Databricks) analysing AI tool usage, served to Tableau"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dbt/target", "data", ".databricks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark`, `dbutils`, `display` are injected globals; imports follow sys.path setup
"databricks/notebooks/*.py" = ["F821", "E402", "I001"]
# Scripts add src/ to sys.path before importing the package
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ai_usage_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
